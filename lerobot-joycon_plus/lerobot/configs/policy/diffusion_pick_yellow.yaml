# @package _global_
seed: 100000
dataset_repo_id: task/pick_yellow
override_dataset_stats: {}

training:
  offline_steps: 200000
  online_steps: 0
  eval_freq: 25000
  save_freq: 25000
  save_checkpoint: true
  batch_size: 64
  grad_clip_norm: 10
  lr: 1.0e-4
  lr_scheduler: cosine
  lr_warmup_steps: 500
  adam_betas: [0.95, 0.999]
  adam_eps: 1.0e-8
  adam_weight_decay: 1.0e-6
  online_steps_between_rollouts: 1
  delta_timestamps:
    "observation.images.right": "[i / ${fps} for i in range(1 - ${policy.n_obs_steps}, 1)]"
    "observation.state": "[i / ${fps} for i in range(1 - ${policy.n_obs_steps}, 1)]"
    action: "[i / ${fps} for i in range(1 - ${policy.n_obs_steps}, 1 - ${policy.n_obs_steps} + ${policy.horizon})]"
  drop_n_last_frames: 7

eval:
  n_episodes: 50
  batch_size: 50

policy:
  name: diffusion
  n_obs_steps: 2
  horizon: 16
  n_action_steps: 8

  input_shapes:
    "observation.images.right": [3, 96, 96]
    "observation.state": ["${env.state_dim}"]
  output_shapes:
    action: ["${env.action_dim}"]

  input_normalization_modes:
    "observation.images.right": mean_std
    "observation.state": min_max
  output_normalization_modes:
    action: min_max

  # ---- model ----
  vision_backbone: resnet18

  # FIX: crop must be <= input image size (96x96)
  crop_shape: [96, 96]
  crop_is_random: false

  pretrained_backbone_weights: null
  use_group_norm: true
  spatial_softmax_num_keypoints: 32

  # Unet.
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  use_film_scale_modulation: true

  # Transformer
  use_transformer: false
  n_layers: 4
  n_heads: 8
  n_embed: 512

  # Added for newer config schema (prevents "missing arguments" warning/error)
  n_emb: 512
  use_separate_rgb_encoder_per_camera: false

  causal_attn: false

  # Noise scheduler.
  noise_scheduler_type: DDPM
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon
  clip_sample: true
  clip_sample_range: 1.0

  # Inference
  num_inference_steps: null

  # Loss
  do_mask_loss_for_padding: false
