# @package _global_

# Diffusion Policy config adapted for LeRobot real-world dataset with key:
#   observation.images.right
# This version disables override_dataset_stats and relies on meta/stats.json from your dataset.

seed: 100000

# You can still override this from CLI, but setting a sensible default helps.
dataset_repo_id: task/pick_yellow

# IMPORTANT:
# The default diffusion.yaml was for PushT and overrides stats with wrong keys/dims.
# Disable overrides and rely on datasets/*/meta/stats.json.
override_dataset_stats: {}

training:
  offline_steps: 200000
  online_steps: 0
  eval_freq: 25000
  save_freq: 25000
  save_checkpoint: true

  batch_size: 64
  grad_clip_norm: 10
  lr: 1.0e-4
  lr_scheduler: cosine
  lr_warmup_steps: 500
  adam_betas: [0.95, 0.999]
  adam_eps: 1.0e-8
  adam_weight_decay: 1.0e-6
  online_steps_between_rollouts: 1

  delta_timestamps:
    "observation.images.right": "[i / ${fps} for i in range(1 - ${policy.n_obs_steps}, 1)]"
    "observation.state": "[i / ${fps} for i in range(1 - ${policy.n_obs_steps}, 1)]"
    action: "[i / ${fps} for i in range(1 - ${policy.n_obs_steps}, 1 - ${policy.n_obs_steps} + ${policy.horizon})]"

  # The original implementation doesn't sample frames for the last 7 steps,
  # which avoids excessive padding and leads to improved training results.
  drop_n_last_frames: 7  # ${policy.horizon} - ${policy.n_action_steps} - ${policy.n_obs_steps} + 1

eval:
  n_episodes: 50
  batch_size: 50

policy:
  name: diffusion

  # Input / output structure.
  n_obs_steps: 2
  horizon: 16
  n_action_steps: 8

  input_shapes:
    "observation.images.right": [3, 96, 96]
    "observation.state": ["${env.state_dim}"]
  output_shapes:
    action: ["${env.action_dim}"]

  # Normalization / Unnormalization
  input_normalization_modes:
    "observation.images.right": mean_std
    "observation.state": min_max
  output_normalization_modes:
    action: min_max

  # Architecture / modeling.
  # Vision backbone.
  vision_backbone: resnet18
  crop_shape: [440, 560]  # keep as original; adjust if you change camera resolution/crop policy
  crop_is_random: false
  pretrained_backbone_weights: null

  use_group_norm: true
  spatial_softmax_num_keypoints: 32

  # Unet.
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  use_film_scale_modulation: true

  # Transformer (optional)
  use_transformer: false
  n_layers: 4
  n_heads: 8
  n_embed: 512
  causal_attn: false

  # Noise scheduler.
  noise_scheduler_type: DDPM
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon  # epsilon / sample

  clip_sample: true
  clip_sample_range: 1.0

  # Inference
  num_inference_steps: null  # if not provided, defaults to `num_train_timesteps`

  # Loss
  do_mask_loss_for_padding: false

